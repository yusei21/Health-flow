services:
  api:
    build: .
    env_file: .env
    environment:
      # Ollama runs on the host; models are not downloaded during the build.
      HEALTHFLOW_LLM_BASE_URL: http://host.docker.internal:11434/v1
      HEALTHFLOW_ML_MODEL_DIR: /srv/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./models:/srv/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Not used by the API yet (Phase F/G); provisioned with pgvector enabled.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-healthflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
